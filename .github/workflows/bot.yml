
name: VEX Guard

on:
  workflow_dispatch:

jobs:
  start-bot:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: التحقق من وجود index.js
        run: |
          echo "ملفات الصفحة الرئيسية:"
          ls -la
          test -f index.js || (echo "خطأ: ملف index.js غير موجود في الصفحة الرئيسية!" && exit 1)

      - name: تثبيت مكتبة Discord
        run: npm install discord.js

      - name: تشغيل VEX Guard
        run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
