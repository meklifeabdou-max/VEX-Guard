
name: VEX Guard

on:
  workflow_dispatch:

jobs:
  start-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Get bot code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install discord.js

      - name: Start VEX Guard
        run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
