
name: VEX Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 تحميل ملفات البوت
        uses: actions/checkout@v4

      - name: ⚙️ إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 تثبيت المكتبات
        run: |
          node --version
          npm install discord.js

      - name: 🔍 التحقق من ملف البوت
        run: |
          ls -la
          node --check vex.js

      - name: 🚀 تشغيل VEX Guard
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: node vex.js
